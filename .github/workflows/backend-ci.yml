name: Backend verification

"on":
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require complete Gradle Wrapper
        run: |
          test -f backend/gradlew
          test -f backend/gradle/wrapper/gradle-wrapper.jar
          test -f backend/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4
      - name: Require Docker
        run: docker info > /dev/null
      - name: Tests and coverage
        working-directory: backend
        run: ./gradlew clean check --no-daemon --stacktrace --console=plain
      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 7

