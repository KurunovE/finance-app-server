{
  "openapi": "3.0.3",
  "info": {
    "title": "Finance Tracker API",
    "version": "0.6.0",
    "description": "API учёта расходов. Регистрация доступна по приглашению; для входа требуется подтверждённая почта. Защищённые запросы используют Authorization: Bearer <accessToken>. Финансовые данные передаются через синхронизацию. Перед синхронизацией получите текущую эпоху через GET /api/v1/sync/status. При смене эпохи требуется полное восстановление локальной копии. Ошибки возвращаются в формате Error; requestId служит для поиска запроса в журнале."
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/v1/auth/register": {
      "post": {
        "operationId": "register",
        "description": "Создаёт пользователя, устройство и начальные категории по одноразовому приглашению. Приглашение расходуется в одной транзакции с созданием аккаунта. Возвращает профиль; токены выдаются после подтверждения почты и входа. Повторный email: 409; недействительное приглашение, неподдерживаемая валюта или отклонённый пароль: 422.",
        "responses": {
          "400": {
            "description": "Некорректный JSON, неизвестное поле, неверный формат или нарушение ограничений входных данных.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Recovery-Epoch": {
                "description": "Текущая эпоха сервера. При изменении остановите обычную синхронизацию и выполните восстановление.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "401": {
            "description": "Отсутствует или недействителен токен либо отклонены данные входа.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Recovery-Epoch": {
                "description": "Текущая эпоха сервера. При изменении остановите обычную синхронизацию и выполните восстановление.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "403": {
            "description": "Доступ запрещён; при удалении аккаунта возможен неверный пароль.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Recovery-Epoch": {
                "description": "Текущая эпоха сервера. При изменении остановите обычную синхронизацию и выполните восстановление.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "409": {
            "description": "Конфликт с текущим состоянием: повторный email, несовпадение эпохи, необходимость восстановления или повтор ID с другим содержимым.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Recovery-Epoch": {
                "description": "Текущая эпоха сервера. При изменении остановите обычную синхронизацию и выполните восстановление.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "422": {
            "description": "Запрос прочитан, но значения отклонены правилами предметной области.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Recovery-Epoch": {
                "description": "Текущая эпоха сервера. При изменении остановите обычную синхронизацию и выполните восстановление.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "500": {
            "description": "Внутренняя ошибка сервера; сохраните requestId для диагностики.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Recovery-Epoch": {
                "description": "Текущая эпоха сервера. При изменении остановите обычную синхронизацию и выполните восстановление.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "429": {
            "description": "Превышен лимит запросов. Повторите запрос после интервала Retry-After.",
            "headers": {
              "Retry-After": {
                "description": "Минимальное время ожидания перед повтором, в секундах.",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              },
              "X-Recovery-Epoch": {
                "description": "Текущая эпоха сервера. При изменении остановите обычную синхронизацию и выполните восстановление.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Сервис временно недоступен, в том числе во время восстановления сервера.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Recovery-Epoch": {
                "description": "Текущая эпоха сервера. При изменении остановите обычную синхронизацию и выполните восстановление.",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            }
          },
          "201": {
            "description": "Операция выполнена. Тело ответа соответствует указанной схеме."
          },
          "413": {
            "description": "Тело JSON превышает 256 КиБ.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Register"
              }
            }
          },
          "description": "JSON с параметрами операции. Обязательные поля отмечены в схеме; неизвестные поля отклоняются."
        },
        "tags": [
          "Авторизация"
        ],
        "summary": "Зарегистрировать аккаунт"
      }
    },
