spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
app:
  account-mail:
    from: ${MAIL_FROM}
    public-url: ${MAIL_PUBLIC_URL}
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXY_REGEX}
      trusted-proxies: ''
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
  # Production requires direct TLS until the
  # private reverse-proxy deployment and its trust boundary are verified in stage 6.
  ssl:
    enabled: true
    key-store: ${TLS_KEY_STORE}
    key-store-password: ${TLS_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    enabled-protocols: TLSv1.2,TLSv1.3

